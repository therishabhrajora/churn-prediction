spring:
  application:
    name: customer-churn-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/churn_db}
    username: ${DB_USERNAME:churn}
    password: ${DB_PASSWORD:churn}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: churn-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.churn.kafka
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

app:
  kafka:
    prediction-request-topic: customer.prediction.requested
    prediction-result-topic: customer.prediction.completed
